
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>견적서 작성기</title>
  <style>
    :root {
      --bg: #f6f7fb; --card: #fff; --text: #1e2430; --muted: #667085;
      --border: #e4e7ec; --primary: #2563eb; --primary-hover: #1d4ed8;
      --green: #059669; --green-soft: #ecfdf5; --red: #dc2626;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .container { max-width: 960px; margin: 0 auto; padding: 20px 16px 64px; }
    header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
    h1 { font-size: 1.35rem; margin: 0; }
    .subtitle { font-size: .84rem; color: var(--muted); }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    button { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 8px 12px; border-radius: 8px; font-size: .84rem; font-weight: 600; cursor: pointer; }
    button:hover { background: #f1f3f9; }
    button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    button.primary:hover { background: var(--primary-hover); }
    button.danger { color: var(--red); }
    .banner { display: none; margin-bottom: 14px; padding: 10px 14px; border-radius: 10px; font-size: .86rem; font-weight: 600; background: var(--green-soft); color: var(--green); border: 1px solid #a7f3d0; }
    .banner.show { display: block; }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .panel-title { font-size: .95rem; font-weight: 700; margin: 0 0 12px; }
    .panel-hint { font-size: .78rem; color: var(--muted); margin: -6px 0 12px; }
    .meta-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
    .field label { display: block; font-size: .78rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: .9rem; font-family: inherit; background: #fff; }
    textarea { min-height: 70px; resize: vertical; }
    .table-wrap { overflow-x: auto; }
    table.edit { width: 100%; border-collapse: collapse; min-width: 720px; }
    table.edit th, table.edit td { padding: 8px 6px; border-bottom: 1px solid var(--border); text-align: left; font-size: .88rem; vertical-align: middle; }
    table.edit th { font-size: .78rem; color: var(--muted); background: #f9fafb; }
    .num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
    .summary-box { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
    .sum-item { background: #f9fafb; border-radius: 10px; padding: 12px 14px; }
    .sum-label { font-size: .78rem; color: var(--muted); }
    .sum-val { font-size: 1.25rem; font-weight: 800; margin-top: 2px; }
    .sum-val.total { color: var(--primary); }
    .stamp-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .stamp-row img { height: 40px; width: 40px; object-fit: contain; border: 1px solid var(--border); border-radius: 6px; background: #fff; }

    /* ===== 견적서 문서 (A4) ===== */
    .preview-wrap { overflow-x: auto; padding: 4px 0 8px; }
    #sheet {
      width: 190mm; margin: 0 auto; background: #fff; color: #000;
      border: 2px solid #000; padding: 0;
      font-family: "Batang", "바탕", "Noto Serif KR", "Nanum Myeongjo", serif;
      font-size: 11px; line-height: 1.3;
    }
    #sheet * { box-sizing: border-box; }
    .s-top { position: relative; height: 15mm; border-bottom: 1px solid #000; }
    .s-no { position: absolute; left: 3mm; top: 2mm; font-size: 10px; font-style: italic; }
    .s-no u { display: inline-block; min-width: 22mm; }
    .s-title { text-align: center; font-size: 26px; font-weight: 700; letter-spacing: 14px; padding-left: 14px; padding-top: 3.5mm; }
    .s-title span { border-bottom: 4px double #000; padding: 0 4px 1px; }
    .s-head { display: flex; border-bottom: 1px solid #000; }
    .s-left { flex: 1; padding: 3mm 3mm 2mm; display: flex; flex-direction: column; justify-content: space-between; min-height: 38mm; }
    .s-date { font-size: 12px; margin-bottom: 4mm; }
    .s-client { border-bottom: 1px solid #000; padding: 1mm 0; font-size: 14px; font-weight: 700; display: flex; justify-content: space-between; gap: 6px; min-height: 7mm; }
    .s-client em { font-style: normal; font-size: 12px; white-space: nowrap; }
    .s-proj { border-bottom: 1px solid #000; padding: 1mm 0; font-size: 11px; min-height: 6.5mm; margin-top: 3mm; }
    .s-greet { font-size: 11px; margin-top: 3mm; }
    table.sup { width: 94mm; border-collapse: collapse; border-left: 1px solid #000; table-layout: fixed; }
    table.sup td { border: 1px solid #000; border-top: 0; border-right: 0; padding: 0 1.5mm; height: 7.4mm; font-size: 10.5px; vertical-align: middle; overflow: hidden; }
    table.sup tr:last-child td { border-bottom: 0; }
    table.sup td.lb { background: #e6e6e6; text-align: center; padding: 0; letter-spacing: 1px; white-space: nowrap; }
    table.sup td.vert { width: 7mm; background: #e6e6e6; text-align: center; padding: 0; line-height: 1.7; }
    table.sup td.val { background: #f1f1f1; }
    table.sup td.stampcell { position: relative; }
    .stampimg { position: absolute; right: 1mm; top: 50%; transform: translateY(-50%); height: 11mm; width: 11mm; object-fit: contain; }
    .stamptxt { position: absolute; right: 2mm; top: 50%; transform: translateY(-50%); color: #bbb; font-size: 11px; }
    .s-total { display: flex; align-items: center; border-bottom: 1px solid #000; min-height: 13mm; padding: 1.5mm 3mm; }
    .s-total .l { width: 38mm; font-size: 14px; font-weight: 700; letter-spacing: 2px; }
    .s-total .l small { display: block; font-size: 9px; font-weight: 400; letter-spacing: 0; }
    .s-total .r { flex: 1; text-align: center; font-size: 14px; font-weight: 700; }
    table.items { width: 100%; border-collapse: collapse; table-layout: fixed; }
    table.items th, table.items td { border: 1px solid #000; border-top: 0; padding: 0 1.5mm; height: 8mm; font-size: 14px; overflow: hidden; }
    table.items th:first-child, table.items td:first-child { border-left: 0; }
    table.items th:last-child, table.items td:last-child { border-right: 0; }
    table.items th { font-weight: 400; background: #e6e6e6; text-align: center; letter-spacing: 2px; height: 7mm; }
    table.items td.r { text-align: right; font-variant-numeric: tabular-nums; }
    table.items td.c { text-align: center; }
    table.items td { white-space: nowrap; text-overflow: ellipsis; }
    table.items tr.sum td { background: #e6e6e6; border-bottom: 0; font-weight: 700; }
    .s-note { border-top: 1px solid #000; padding: 2mm 3mm; font-size: 10.5px; white-space: pre-wrap; min-height: 12mm; }
    .s-note b { font-weight: 700; }

    @page { size: A4 portrait; margin: 10mm; }
    @media print {
      body { background: #fff; }
      .no-print { display: none !important; }
      .container { max-width: none; padding: 0; }
      .preview-wrap { overflow: visible; padding: 0; }
      #sheet { margin: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="no-print">
      <div>
        <h1>견적서 작성기</h1>
        <div class="subtitle">입력하면 아래 견적서 양식에 바로 반영됩니다 · 내 브라우저에 자동 저장</div>
      </div>
      <div class="toolbar">
        <button type="button" onclick="exportJSON()">JSON 백업</button>
        <button type="button" onclick="document.getElementById('importFile').click()">JSON 복원</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)" />
        <button type="button" onclick="savePNG()">PNG 저장</button>
        <button type="button" class="primary" onclick="window.print()">PDF 저장 / 인쇄</button>
      </div>
    </header>

    <div id="banner" class="banner no-print"></div>

    <section class="panel no-print">
      <div class="panel-title">견적 기본 정보</div>
      <div class="meta-grid">
        <div class="field"><label>견적 번호 (No.)</label><input type="text" data-k="no" placeholder="예: 2026-001" /></div>
        <div class="field"><label>견적일자</label><input type="date" data-k="quoteDate" /></div>
        <div class="field"><label>수신 (거래처 / 고객명)</label><input type="text" data-k="clientName" placeholder="예: OO컴퍼니" /></div>
        <div class="field"><label>건명 / 프로젝트명</label><input type="text" data-k="quoteTitle" placeholder="예: 홈페이지 리뉴얼" /></div>
        <div class="field">
          <label>부가세 적용</label>
          <select data-k="vatMode">
            <option value="add">부가세 10% 별도 계산</option>
            <option value="none">부가세 없음 (면세/비과세)</option>
          </select>
        </div>
      </div>
    </section>

    <section class="panel no-print">
      <div class="panel-title">공급자 정보</div>
      <div class="panel-hint">한 번 입력하면 저장되어 다음 견적서에도 그대로 사용됩니다.</div>
      <div class="meta-grid">
        <div class="field"><label>등록번호 (사업자등록번호)</label><input type="text" data-k="bizNo" placeholder="000-00-00000" /></div>
        <div class="field"><label>상호 (법인명)</label><input type="text" data-k="compName" /></div>
        <div class="field"><label>성명 (대표자)</label><input type="text" data-k="ceoName" /></div>
        <div class="field"><label>사업장주소</label><input type="text" data-k="addr" /></div>
        <div class="field"><label>업태</label><input type="text" data-k="bizType" /></div>
        <div class="field"><label>종목</label><input type="text" data-k="bizItem" /></div>
        <div class="field"><label>전화번호</label><input type="text" data-k="tel" placeholder="010-0000-0000" /></div>
        <div class="field">
          <label>직인 이미지 (투명 PNG 권장)</label>
          <div class="stamp-row">
            <img id="stampThumb" alt="" style="display:none" />
            <button type="button" onclick="document.getElementById('stampFile').click()">이미지 선택</button>
            <button type="button" class="danger" id="stampDel" onclick="clearStamp()" style="display:none">삭제</button>
            <input type="file" id="stampFile" accept="image/*" style="display:none" onchange="loadStamp(event)" />
          </div>
        </div>
      </div>
    </section>

    <section class="panel no-print">
      <div class="panel-title">견적 항목</div>
      <div class="table-wrap">
        <table class="edit">
          <thead>
            <tr>
              <th style="width:28%;">품명</th>
              <th style="width:12%;">규격</th>
              <th style="width:10%; text-align:right;">수량</th>
              <th style="width:15%; text-align:right;">단가 (원)</th>
              <th style="width:15%; text-align:right;">공급가액</th>
              <th style="width:14%;">비고</th>
              <th style="width:6%;"></th>
            </tr>
          </thead>
          <tbody id="itemRows"></tbody>
        </table>
      </div>
      <div style="margin-top:10px;"><button type="button" class="primary" onclick="addRow()">+ 항목 추가</button></div>
      <div class="summary-box">
        <div class="sum-item"><div class="sum-label">공급가액 합계</div><div class="sum-val" id="subtotalDisplay">0원</div></div>
        <div class="sum-item"><div class="sum-label">부가세 (VAT)</div><div class="sum-val" id="vatDisplay">0원</div></div>
        <div class="sum-item"><div class="sum-label">합계금액</div><div class="sum-val total" id="totalDisplay">0원</div></div>
      </div>
    </section>

    <section class="panel no-print">
      <div class="panel-title">비고 (결제 조건 · 유효기간 등)</div>
      <textarea data-k="noteText" placeholder="예: 견적 유효기간은 발행일로부터 14일입니다. 계약금 50%, 잔금 완료 시 지급."></textarea>
    </section>

    <div class="no-print" style="font-size:.84rem; font-weight:700; margin:20px 0 8px;">견적서 미리보기 <span style="font-weight:400; color:var(--muted);">(이 모습 그대로 PDF/PNG로 저장됩니다)</span></div>
    <div class="preview-wrap"><div id="sheet"></div></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    const STORAGE_KEY = "my_quote_builder_v1";
    const MIN_ROWS = 20;
    const FIELDS = ["no","quoteDate","clientName","quoteTitle","vatMode","bizNo","compName","ceoName","addr","bizType","bizItem","tel","noteText"];

    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    }

    let state = {
      no: "", quoteDate: todayISO(), clientName: "", quoteTitle: "", vatMode: "add", noteText: "",
      bizNo: "", compName: "", ceoName: "", addr: "", bizType: "", bizItem: "", tel: "", stamp: "",
      rows: [{ name: "기본 작업 항목", spec: "식", qty: 1, price: 100000, note: "" }]
    };

    function normalizeRows(rows) {
      return rows.map(r => ({
        name: r.name || "", spec: r.spec ?? r.unit ?? "", qty: Number(r.qty) || 0,
        price: Number(r.price) || 0, note: r.note || ""
      }));
    }

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (saved && typeof saved === "object") {
        state = { ...state, ...saved };
        if (!state.compName && saved.senderName) state.compName = saved.senderName;
        state.rows = Array.isArray(saved.rows) && saved.rows.length ? normalizeRows(saved.rows) : state.rows;
      }
    } catch {}

    const $ = id => document.getElementById(id);
    const won = n => Math.round(n).toLocaleString("ko-KR");
    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function showBanner(msg) {
      const el = $("banner"); el.textContent = msg; el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 3000);
    }

    function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {} }

    // 한글 금액 (예: 110000 -> 일십일만)
    function toKorean(n) {
      n = Math.floor(n);
      if (n === 0) return "영";
      const dig = ["","일","이","삼","사","오","육","칠","팔","구"];
      const sub = ["","십","백","천"];
      const big = ["","만","억","조"];
      let out = "", g = 0;
      while (n > 0) {
        let chunk = n % 10000, s = "";
        for (let i = 0; i < 4; i++) {
          const d = Math.floor(chunk / Math.pow(10, i)) % 10;
          if (d) s = dig[d] + sub[i] + s;
        }
        if (s) out = s + big[g] + out;
        n = Math.floor(n / 10000); g++;
      }
      return out;
    }

    function calc() {
      let sub = 0, vat = 0;
      const lines = state.rows.map(r => {
        const amt = Math.round((Number(r.qty) || 0) * (Number(r.price) || 0));
        const tax = state.vatMode === "add" ? Math.round(amt * 0.1) : 0;
        sub += amt; vat += tax;
        return { amt, tax };
      });
      return { lines, sub, vat, total: sub + vat };
    }

    function dateKR(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
      return m ? `${m[1]}년 ${+m[2]}월 ${+m[3]}일` : "";
    }

    /* ---------- 입력 폼 ---------- */
    function syncInputs() {
      FIELDS.forEach(k => { const el = document.querySelector(`[data-k="${k}"]`); if (el) el.value = state[k] || ""; });
      refreshStampUI();
    }

    document.querySelectorAll("[data-k]").forEach(el => {
      const h = () => { state[el.dataset.k] = el.value; save(); update(); };
      el.addEventListener("input", h); el.addEventListener("change", h);
    });

    function renderRows() {
      $("itemRows").innerHTML = state.rows.map((r, i) => `
        <tr>
          <td><input type="text" value="${esc(r.name)}" placeholder="품명" oninput="updateRow(${i},'name',this.value)" /></td>
          <td><input type="text" value="${esc(r.spec)}" placeholder="식/개/EA" oninput="updateRow(${i},'spec',this.value)" /></td>
          <td><input type="number" min="0" step="any" value="${r.qty}" style="text-align:right;" oninput="updateRow(${i},'qty',this.value)" /></td>
          <td><input type="number" min="0" step="any" value="${r.price}" style="text-align:right;" oninput="updateRow(${i},'price',this.value)" /></td>
          <td class="num" id="lineTotal-${i}">0</td>
          <td><input type="text" value="${esc(r.note)}" oninput="updateRow(${i},'note',this.value)" /></td>
          <td><button type="button" class="danger" onclick="removeRow(${i})">삭제</button></td>
        </tr>`).join("");
    }

    function addRow() { state.rows.push({ name: "", spec: "", qty: 1, price: 0, note: "" }); save(); renderRows(); update(); }
    function removeRow(i) {
      if (state.rows.length <= 1) state.rows = [{ name: "", spec: "", qty: 1, price: 0, note: "" }];
      else state.rows.splice(i, 1);
      save(); renderRows(); update();
    }
    function updateRow(i, k, v) {
      if (!state.rows[i]) return;
      state.rows[i][k] = (k === "qty" || k === "price") ? (Number(v) || 0) : v;
      save(); update();
    }

    /* ---------- 직인 ---------- */
    function refreshStampUI() {
      const has = !!state.stamp;
      $("stampThumb").style.display = has ? "block" : "none";
      $("stampDel").style.display = has ? "inline-block" : "none";
      if (has) $("stampThumb").src = state.stamp;
    }
    function loadStamp(e) {
      const f = e.target.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = ev => {
        const img = new Image();
        img.onload = () => {
          const s = Math.min(1, 300 / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          state.stamp = c.toDataURL("image/png");
          save(); refreshStampUI(); update();
        };
        img.src = ev.target.result;
      };
      rd.readAsDataURL(f); e.target.value = "";
    }
    function clearStamp() { state.stamp = ""; save(); refreshStampUI(); update(); }

    /* ---------- 문서 렌더링 ---------- */
    function update() {
      const c = calc();
      c.lines.forEach((l, i) => { const el = $(`lineTotal-${i}`); if (el) el.textContent = won(l.amt); });
      $("subtotalDisplay").textContent = won(c.sub) + "원";
      $("vatDisplay").textContent = won(c.vat) + "원";
      $("totalDisplay").textContent = won(c.total) + "원";

      const total = Math.max(MIN_ROWS, state.rows.length);
      let body = "";
      for (let i = 0; i < total; i++) {
        const r = state.rows[i];
        if (r) {
          const l = c.lines[i];
          body += `<tr><td>${esc(r.name)}</td><td class="c">${esc(r.spec)}</td><td class="r">${r.qty ? esc(r.qty) : ""}</td><td class="r">${r.price ? won(r.price) : ""}</td><td class="r">${l.amt ? won(l.amt) : ""}</td><td class="r">${l.tax ? won(l.tax) : ""}</td><td>${esc(r.note)}</td></tr>`;
        } else body += `<tr><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
      }
      const qtySum = state.rows.reduce((a, r) => a + (Number(r.qty) || 0), 0);
      const stamp = state.stamp ? `<img class="stampimg" src="${state.stamp}" alt="">` : `<span class="stamptxt">(인)</span>`;

      $("sheet").innerHTML = `
        <div class="s-top">
          <div class="s-no"><u>No. ${esc(state.no)}</u></div>
          <div class="s-title"><span>견적서</span></div>
        </div>
        <div class="s-head">
          <div class="s-left">
            <div>
              <div class="s-date">${esc(dateKR(state.quoteDate))}</div>
              <div class="s-client"><span>${esc(state.clientName)}</span><em>귀하</em></div>
              <div class="s-proj">${state.quoteTitle ? "건명: " + esc(state.quoteTitle) : "&nbsp;"}</div>
            </div>
            <div class="s-greet">아래와 같이 견적합니다.</div>
          </div>
          <table class="sup">
            <colgroup><col style="width:7mm"><col style="width:20mm"><col><col style="width:11mm"><col style="width:24mm"></colgroup>
            <tr><td class="vert" rowspan="5">공<br>급<br>자</td><td class="lb">등 록 번 호</td><td class="val" colspan="3">${esc(state.bizNo)}</td></tr>
            <tr><td class="lb">상호(법인명)</td><td class="val">${esc(state.compName)}</td><td class="lb">성명</td><td class="val stampcell">${esc(state.ceoName)}${stamp}</td></tr>
            <tr><td class="lb">사업장주소</td><td class="val" colspan="3">${esc(state.addr)}</td></tr>
            <tr><td class="lb">업 태</td><td class="val">${esc(state.bizType)}</td><td class="lb">종목</td><td class="val">${esc(state.bizItem)}</td></tr>
            <tr><td class="lb">전 화 번 호</td><td class="val" colspan="3">${esc(state.tel)}</td></tr>
          </table>
        </div>
        <div class="s-total">
          <div class="l">합 계 금 액<small>(공급가액+세액)</small></div>
          <div class="r">일금 ${toKorean(c.total)} 원整 &nbsp;(₩ ${won(c.total)})</div>
        </div>
        <table class="items">
          <colgroup><col style="width:27%"><col style="width:9%"><col style="width:8%"><col style="width:13%"><col style="width:15%"><col style="width:12%"><col style="width:16%"></colgroup>
          <thead><tr><th>품 명</th><th>규 격</th><th>수 량</th><th>단 가</th><th>공 급 가 액</th><th>세 액</th><th>비 고</th></tr></thead>
          <tbody>${body}
            <tr class="sum"><td class="c">계</td><td></td><td class="r">${qtySum ? esc(qtySum) : 0}</td><td class="r">0</td><td class="r">${won(c.sub)}</td><td class="r">${won(c.vat)}</td><td></td></tr>
          </tbody>
        </table>
        ${state.noteText.trim() ? `<div class="s-note"><b>비고</b>\n${esc(state.noteText)}</div>` : ""}`;
    }

    /* ---------- 저장/백업 ---------- */
    function savePNG() {
      if (typeof html2canvas !== "function") { showBanner("PNG 저장 기능을 불러오지 못했습니다. 인터넷 연결을 확인해주세요."); return; }
      html2canvas($("sheet"), { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
        const marginTop=96,marginX=72,marginBottom=48;const output=document.createElement("canvas");output.width=canvas.width+marginX*2;output.height=canvas.height+marginTop+marginBottom;const ctx=output.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,output.width,output.height);ctx.drawImage(canvas,marginX,marginTop);output.toBlob(blob => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = `견적서_${(state.clientName || "견적").replace(/[\\/:*?"<>|]/g, "")}_${state.quoteDate || todayISO()}.png`;
          a.click();
          showBanner("견적서 PNG를 저장했습니다.");
        });
      });
    }

    function exportJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `견적서백업_${todayISO()}.json`;
      a.click();
      showBanner("JSON 백업 파일을 내려받았습니다.");
    }

    function importJSON(e) {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const p = JSON.parse(ev.target.result);
          if (!p || !Array.isArray(p.rows)) throw new Error();
          state = { ...state, ...p, rows: normalizeRows(p.rows) };
          if (!state.compName && p.senderName) state.compName = p.senderName;
          save(); syncInputs(); renderRows(); update();
          showBanner("견적서 데이터를 복원했습니다.");
        } catch { showBanner("올바른 견적서 JSON 파일이 아닙니다."); }
      };
      reader.readAsText(file); e.target.value = "";
    }

    syncInputs(); renderRows(); update();
  </script>

  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
  </script>
</body>
</html>
